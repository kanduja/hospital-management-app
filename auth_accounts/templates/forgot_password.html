{% load static %}

<html>

<head>

<link
rel="stylesheet"
href="{% static 'forgot_password.css' %}">

</head>

<body>

<div class="card">

<h1>

Reset Password

</h1>

<p>

Enter email to receive reset link

</p>

<form method="POST">

{% csrf_token %}

<input
type="email"
name="email"
placeholder="Enter Email"
required>

<button>

SEND RESET LINK

</button>

</form>

</div>

</body>

</html>
