{% load static %}

<!DOCTYPE html>

<html>

<head>

<title>Reception Login</title>

<link rel="stylesheet"
href="{% static 'receptionist_login.css' %}">

</head>

<body>

<div class="container">

<div class="left">

<h1>

Reception <br>
Portal

</h1>


<p>

Manage schedules,
guide patients,
keep healthcare flowing.

</p>


<div class="quote">

"The first smile in a hospital
can change someone's day."

</div>


</div>



<div class="right">

<div class="login-box">

<h2>

📋 Reception Login

</h2>

<form method="POST">

{% csrf_token %}

<input
type="text"
name="username"
placeholder="Receptionist Username"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<div class="options">

<label>

<input
type="checkbox">

Remember me

</label>

<a
href="{% url 'forgot_password' %}">

Forgot Password?

</a>

</div>

<button
type="submit">

LOGIN

</button>

</form>

<a
href="{% url 'home' %}"
class="back">

← Back Home

</a>


</div>

</div>

</div>

</body>

</html>
